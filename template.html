<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Imóveis · São Paulo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <h1>Mapa de Imóveis</h1>
      <span>São Paulo · <span id="total-cities">645</span> municípios</span>
    </div>

    <div class="search">
      <input id="search" list="city-options" type="search" placeholder="Buscar cidade…" autocomplete="off">
      <datalist id="city-options"></datalist>
    </div>

    <div class="legend" id="legend">
      <button type="button" data-status="none" aria-pressed="false"><span class="dot none"></span>Sem análise <span class="n" id="count-none">0</span></button>
      <button type="button" data-status="wip"  aria-pressed="false"><span class="dot wip"></span>Em andamento <span class="n" id="count-wip">0</span></button>
      <button type="button" data-status="no"   aria-pressed="false"><span class="dot no"></span>Não aprovado <span class="n" id="count-no">0</span></button>
      <button type="button" data-status="ok"   aria-pressed="false"><span class="dot ok"></span>Aprovado <span class="n" id="count-ok">0</span></button>
    </div>

    <div class="controls">
      <button type="button" id="toggle-ranking" title="Mostrar ranking de cidades">📊 Ranking</button>
      <button type="button" id="toggle-heatmap" title="Alternar modo heatmap por preço">🔥 Heatmap</button>
    </div>

    <div class="tools">
      <button type="button" id="btn-export">Exportar</button>
      <button type="button" id="btn-import">Importar</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
      <button type="button" id="btn-reset">Limpar</button>
    </div>
  </header>

  <main class="stage">
    <div id="map-wrap">
<!--SVG-->
    </div>

    <div class="zoom">
      <button type="button" id="zoom-in"  title="Aproximar">+</button>
      <button type="button" id="zoom-out" title="Afastar">−</button>
      <button type="button" id="zoom-reset" title="Enquadrar tudo">⤢</button>
    </div>
    <div class="hint">Clique numa cidade para cadastrar · scroll para zoom · arraste para mover</div>

    <aside class="ranking-panel" id="ranking-panel" hidden>
      <h3>Ranking de cidades <button type="button" id="close-ranking" aria-label="Fechar">✕</button></h3>
      <div class="ranking-tabs">
        <button type="button" class="tab-btn active" data-type="rent">Aluguel</button>
        <button type="button" class="tab-btn" data-type="buy">Compra</button>
      </div>
      <div class="ranking-list" id="ranking-list"></div>
    </aside>
  </main>

</div>

<div id="tooltip" role="tooltip" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="backdrop" id="backdrop"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <header>
    <div class="row">
      <div>
        <h2 id="d-title">Cidade</h2>
        <div class="sub" id="d-sub"></div>
      </div>
      <button class="close" id="d-close" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="status-picker" id="status-picker"></div>
  </header>

  <div class="body">
    <div class="stats" id="stats"></div>

    <h3 class="sec">Novo imóvel</h3>
    <form class="card-form" id="prop-form" novalidate>
      <div class="field">
        <label for="f-desc">Descrição</label>
        <textarea id="f-desc" placeholder="Ex.: Casa 3 dorm, 120m², bairro Jardim…"></textarea>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-type">Tipo</label>
          <select id="f-type">
            <option value="rent">Aluguel</option>
            <option value="buy">Compra</option>
          </select>
        </div>
        <div class="field">
          <label for="f-value">Valor (R$)</label>
          <input id="f-value" type="text" inputmode="decimal" placeholder="2.500,00">
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-condo">Condomínio (R$/mês)</label>
          <input id="f-condo" type="text" inputmode="decimal" placeholder="opcional">
        </div>
        <div class="field">
          <label for="f-area">Área (m²)</label>
          <input id="f-area" type="text" inputmode="decimal" placeholder="opcional">
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-bedrooms">Quartos</label>
          <input id="f-bedrooms" type="text" inputmode="numeric" placeholder="opcional">
        </div>
        <div class="field">
          <label for="f-parking">Vagas de garagem</label>
          <input id="f-parking" type="text" inputmode="numeric" placeholder="opcional">
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-iptu">IPTU (R$/ano)</label>
          <input id="f-iptu" type="text" inputmode="decimal" placeholder="opcional">
        </div>
        <div class="field">
          <label for="f-visit-date">Data da visita</label>
          <input id="f-visit-date" type="date" placeholder="opcional">
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-rating">Nota (0-5)</label>
          <input id="f-rating" type="number" min="0" max="5" step="0.5" placeholder="opcional">
        </div>
      </div>
      <div class="field">
        <label for="f-url">Link do anúncio</label>
        <input id="f-url" type="url" placeholder="https://…">
      </div>
      <div class="err" id="f-err"></div>
      <div class="form-actions">
        <button class="btn primary" id="f-submit" type="submit">Adicionar imóvel</button>
        <button class="btn ghost" id="f-cancel" type="button" hidden>Cancelar</button>
      </div>
    </form>

    <h3 class="sec">Imóveis cadastrados</h3>
    <ul class="list" id="list"></ul>
  </div>
</aside>

<script src="cities.js"></script>
<script src="app.js"></script>
</body>
</html>
