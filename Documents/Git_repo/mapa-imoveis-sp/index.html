<div id="tooltip" role="tooltip" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="backdrop" id="backdrop"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
  <header>
    <div class="row">
      <div>
        <h2 id="d-title">Cidade</h2>
        <div class="sub" id="d-sub"></div>
      </div>
      <button class="close" id="d-close" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="status-picker" id="status-picker"></div>
  </header>

  <div class="body">
    <div class="stats" id="stats"></div>

    <h3 class="sec">Novo imóvel</h3>
    <form class="card-form" id="prop-form" novalidate>
      <div class="field">
        <label for="f-desc">Descrição</label>
        <textarea id="f-desc" placeholder="Ex.: Casa 3 dorm, 120m², bairro Jardim…"></textarea>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-type">Tipo</label>
          <select id="f-type">
            <option value="rent">Aluguel</option>
            <option value="buy">Compra</option>
          </select>
        </div>
        <div class="field">
          <label for="f-value">Valor (R$)</label>
          <input id="f-value" type="text" inputmode="decimal" placeholder="2.500,00">
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-condo">Condomínio (R$/mês)</label>
          <input id="f-condo" type="text" inputmode="decimal" placeholder="opcional">
        </div>
        <div class="field">
          <label for="f-area">Área (m²)</label>
          <input id="f-area" type="text" inputmode="decimal" placeholder="opcional">
        </div>
      </div>
      <div class="two">
        <div class="field">
          <label for="f-bedrooms">Quartos</label>
          <input id="f-bedrooms" type="text" inputmode="numeric" placeholder="opcional">
        </div>
        <div class="field">
          <label for="f-parking">Vagas de garagem</label>
          <input id="f-parking" type="text" inputmode="numeric" placeholder="opcional">
        </div>
      </div>
      <div class="field">
        <label for="f-url">Link do anúncio</label>
        <input id="f-url" type="url" placeholder="https://…">
      </div>
      <div class="err" id="f-err"></div>
      <div class="form-actions">
        <button class="btn primary" id="f-submit" type="submit">Adicionar imóvel</button>
        <button class="btn ghost" id="f-cancel" type="button" hidden>Cancelar</button>
      </div>
    </form>

    <h3 class="sec">Imóveis cadastrados</h3>
    <ul class="list" id="list"></ul>
  </div>
</aside>

<script src="cities.js"></script>
<script src="app.js"></script>
